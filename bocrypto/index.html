<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoCrypto — Hive Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --red: #e63946; --red-dark: #c1121f; --gold: #ffd60a;
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: #2a2a3a; --text: #e8e8f0; --text-dim: #7a7a9a;
  }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(230,57,70,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(230,57,70,0.03) 1px,transparent 1px); background-size:40px 40px; animation:gridMove 20s linear infinite; }
  @keyframes gridMove { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
  .orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; }
  .orb-1 { width:400px; height:400px; background:rgba(230,57,70,0.08); top:-100px; left:-100px; animation:float1 8s ease-in-out infinite; }
  .orb-2 { width:300px; height:300px; background:rgba(255,214,10,0.05); bottom:-50px; right:-50px; animation:float2 10s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,30px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,-20px)} }
  .container { position:relative; z-index:10; width:100%; max-width:480px; padding:20px; }
  .logo { text-align:center; margin-bottom:40px; animation:fadeDown 0.6s ease both; }
  .logo-text { font-family:'Orbitron',monospace; font-size:2.8rem; font-weight:900; letter-spacing:4px; background:linear-gradient(135deg,var(--red) 0%,var(--gold) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .logo-sub { font-size:0.85rem; letter-spacing:6px; color:var(--text-dim); text-transform:uppercase; margin-top:4px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; position:relative; overflow:hidden; animation:fadeUp 0.6s ease 0.2s both; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--red),var(--gold),transparent); }
  .card-title { font-family:'Orbitron',monospace; font-size:1rem; letter-spacing:3px; color:var(--text-dim); text-transform:uppercase; margin-bottom:28px; text-align:center; }
  .input-group { margin-bottom:20px; }
  .input-label { display:block; font-size:0.8rem; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; margin-bottom:8px; }
  .input-wrap { position:relative; }
  .input-wrap::before { content:'@'; position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--red); font-family:'Orbitron',monospace; font-size:0.9rem; }
  input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:14px 16px 14px 38px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:1.1rem; letter-spacing:1px; transition:border-color 0.2s,box-shadow 0.2s; outline:none; }
  input:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(230,57,70,0.1); }
  input::placeholder { color:var(--text-dim); font-size:0.95rem; }
  .btn { width:100%; padding:16px; background:linear-gradient(135deg,var(--red-dark),var(--red)); border:none; border-radius:8px; color:white; font-family:'Orbitron',monospace; font-size:0.9rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
  .btn::before { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent); transition:left 0.4s; }
  .btn:hover::before { left:100%; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 8px 25px rgba(230,57,70,0.4); }
  .btn:active { transform:translateY(0); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .status { margin-top:16px; padding:12px 16px; border-radius:8px; font-size:0.9rem; letter-spacing:1px; display:none; animation:fadeIn 0.3s ease; }
  .status.error { display:block; background:rgba(230,57,70,0.1); border:1px solid rgba(230,57,70,0.3); color:#ff6b78; }
  .status.info { display:block; background:rgba(255,214,10,0.08); border:1px solid rgba(255,214,10,0.2); color:var(--gold); }
  .keychain-note { text-align:center; margin-top:20px; font-size:0.8rem; color:var(--text-dim); letter-spacing:1px; }
  .keychain-note a { color:var(--red); text-decoration:none; }
  #dashboard { display:none; animation:fadeUp 0.5s ease both; }
  .user-header { display:flex; align-items:center; gap:16px; margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .avatar { width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--red),var(--gold)); display:flex; align-items:center; justify-content:center; font-family:'Orbitron',monospace; font-size:1.2rem; font-weight:900; color:white; flex-shrink:0; }
  .user-info h2 { font-family:'Orbitron',monospace; font-size:1rem; color:var(--text); }
  .user-info p { font-size:0.8rem; color:var(--text-dim); letter-spacing:1px; margin-top:2px; }
  .logout-btn { margin-left:auto; background:none; border:1px solid var(--border); color:var(--text-dim); padding:6px 14px; border-radius:6px; font-family:'Rajdhani',sans-serif; font-size:0.85rem; letter-spacing:1px; cursor:pointer; transition:all 0.2s; }
  .logout-btn:hover { border-color:var(--red); color:var(--red); }
  .balances-title { font-family:'Orbitron',monospace; font-size:0.75rem; letter-spacing:3px; color:var(--text-dim); text-transform:uppercase; margin-bottom:16px; }
  .balances-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .balance-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px; transition:border-color 0.2s,transform 0.2s; position:relative; overflow:hidden; }
  .balance-card:hover { border-color:var(--red); transform:translateY(-2px); }
  .balance-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; opacity:0; transition:opacity 0.2s; }
  .balance-card:hover::after { opacity:1; }
  .balance-card.hive::after { background:linear-gradient(90deg,#e63946,#ff6b78); }
  .balance-card.hbd::after { background:linear-gradient(90deg,#ffd60a,#ffb700); }
  .balance-card.token::after { background:linear-gradient(90deg,#4cc9f0,#4361ee); }
  .token-symbol { font-family:'Orbitron',monospace; font-size:0.7rem; letter-spacing:2px; color:var(--text-dim); margin-bottom:8px; }
  .token-amount { font-family:'Orbitron',monospace; font-size:1.3rem; font-weight:700; color:var(--text); }
  .token-amount.loading { color:var(--text-dim); font-size:0.9rem; animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .shop-link { display:block; margin-top:20px; padding:16px; background:linear-gradient(135deg,#c1121f,#e63946); border-radius:8px; color:white; font-family:'Orbitron',monospace; font-size:0.85rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; text-align:center; text-decoration:none; transition:all 0.2s; }
  .shop-link:hover { transform:translateY(-1px); box-shadow:0 8px 25px rgba(230,57,70,0.4); }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="container">
  <div class="logo">
    <div class="logo-text">BoCrypto</div>
    <div class="logo-sub">Hive Web3 Platform</div>
  </div>
  <div class="card" id="loginCard">
    <div class="card-title">Connect Wallet</div>
    <div class="input-group">
      <label class="input-label" for="username">Hive Username</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="your-hive-username" autocomplete="off" />
      </div>
    </div>
    <button class="btn" id="loginBtn" onclick="loginWithKeychain()">Login with Keychain</button>
    <div class="status" id="statusMsg"></div>
    <div class="keychain-note">Need Keychain? <a href="https://hive-keychain.com" target="_blank">Download here</a></div>
  </div>
  <div class="card" id="dashboard">
    <div class="user-header">
      <div class="avatar" id="avatarEl">?</div>
      <div class="user-info">
        <h2 id="displayName">Loading...</h2>
        <p>HIVE ACCOUNT</p>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="balances-title">Token Balances</div>
    <div class="balances-grid">
      <div class="balance-card hive"><div class="token-symbol">HIVE</div><div class="token-amount loading" id="bal-HIVE">Loading...</div></div>
      <div class="balance-card hbd"><div class="token-symbol">HBD</div><div class="token-amount loading" id="bal-HBD">Loading...</div></div>
      <div class="balance-card token"><div class="token-symbol">BPW</div><div class="token-amount loading" id="bal-BPW">Loading...</div></div>
      <div class="balance-card token"><div class="token-symbol">BOCRYPTO</div><div class="token-amount loading" id="bal-BOCRYPTO">Loading...</div></div>
      <div class="balance-card token" style="grid-column:span 2"><div class="token-symbol">BCM</div><div class="token-amount loading" id="bal-BCM">Loading...</div></div>
    </div>
    <a href="shop.html" class="shop-link">🛒 ENTER SHOP</a>
    <a href="dungeon.html" style="display:block;margin-top:12px;padding:14px;background:linear-gradient(135deg,#1a0a0a,#4a1010);border:1px solid #5a2020;border-radius:8px;color:#c43030;font-family:'Orbitron',monospace;font-size:0.8rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center;text-decoration:none;transition:all 0.2s;" onmouseover="this.style.borderColor='#e63946';this.style.color='#e63946'" onmouseout="this.style.borderColor='#5a2020';this.style.color='#c43030'">⚔ BOCRYPTO DUNGEON</a>
    <a href="leaderboard.html" style="display:block;margin-top:12px;padding:14px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-family:'Orbitron',monospace;font-size:0.8rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center;text-decoration:none;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-dim)'">🏆 LEADERBOARD</a>
    <a href="faucet.html" style="display:block;margin-top:12px;padding:14px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-family:'Orbitron',monospace;font-size:0.8rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center;text-decoration:none;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-dim)'">⚡ BPW FAUCET</a>
    <a href="https://bokipw.github.io/hive-galaxy/" target="_blank" rel="noopener" style="display:block;margin-top:12px;padding:14px;background:linear-gradient(135deg,#0a1030,#1a2a6a);border:1px solid #3a5ad0;border-radius:8px;color:#6aa0ff;font-family:'Orbitron',monospace;font-size:0.8rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center;text-decoration:none;transition:all 0.2s;" onmouseover="this.style.borderColor='#8ab8ff';this.style.color='#8ab8ff'" onmouseout="this.style.borderColor='#3a5ad0';this.style.color='#6aa0ff'">🚀 HIVE GALAXY</a>
  </div>
</div>
<script>
  let currentUser = null;

  window.addEventListener('load', function() {
    const saved = sessionStorage.getItem('bocrypto_user');
    if (saved) { currentUser = saved; showDashboard(saved); }
  });

  function showStatus(msg, type) { const el=document.getElementById('statusMsg'); el.textContent=msg; el.className='status '+type; }
  function hideStatus() { document.getElementById('statusMsg').className='status'; }

  async function loginWithKeychain() {
    const username = document.getElementById('username').value.trim().toLowerCase();
    if (!username) { showStatus('Please enter your Hive username.','error'); return; }
    if (typeof window.hive_keychain==='undefined') { showStatus('Hive Keychain not detected. Please install the browser extension.','error'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled=true; btn.textContent='Connecting...';
    showStatus('Waiting for Keychain confirmation...','info');
    window.hive_keychain.requestSignBuffer(username,`BoCrypto Login - ${Date.now()}`,'Posting',function(response){
      btn.disabled=false; btn.textContent='Login with Keychain';
      if (response.success) {
        currentUser=username;
        sessionStorage.setItem('bocrypto_user',username);
        hideStatus();
        showDashboard(username);
      } else {
        showStatus(response.message||'Login cancelled or failed.','error');
      }
    });
  }

  function showDashboard(username) {
    document.getElementById('loginCard').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('avatarEl').textContent=username[0].toUpperCase();
    document.getElementById('displayName').textContent='@'+username;
    loadHiveBalances(username);
    loadHiveEngineBalances(username);
  }

  async function loadHiveBalances(username) {
    try {
      const res=await fetch('https://api.hive.blog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'condenser_api.get_accounts',params:[[username]],id:1})});
      const data=await res.json(); const account=data.result[0];
      if(account){
        document.getElementById('bal-HIVE').textContent=parseFloat(account.balance).toFixed(3); document.getElementById('bal-HIVE').className='token-amount';
        document.getElementById('bal-HBD').textContent=parseFloat(account.hbd_balance).toFixed(3); document.getElementById('bal-HBD').className='token-amount';
      }
    } catch(e){document.getElementById('bal-HIVE').textContent='Error';document.getElementById('bal-HBD').textContent='Error';}
  }

  async function loadHiveEngineBalances(username) {
    const tokens=['BPW','BOCRYPTO','BCM'];
    try {
      const res=await fetch('https://api.hive-engine.com/rpc/contracts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'find',params:{contract:'tokens',table:'balances',query:{account:username,symbol:{'$in':tokens}},limit:10,offset:0},id:1})});
      const data=await res.json();
      tokens.forEach(t=>{document.getElementById('bal-'+t).textContent='0.000';document.getElementById('bal-'+t).className='token-amount';});
      (data.result||[]).forEach(b=>{const el=document.getElementById('bal-'+b.symbol);if(el){el.textContent=parseFloat(b.balance).toFixed(3);el.className='token-amount';}});
    } catch(e){tokens.forEach(t=>{const el=document.getElementById('bal-'+t);if(el)el.textContent='Error';});}
  }

  function logout() {
    currentUser=null;
    sessionStorage.removeItem('bocrypto_user');
    document.getElementById('dashboard').style.display='none';
    document.getElementById('loginCard').style.display='block';
    document.getElementById('username').value='';
    hideStatus();
  }

  document.getElementById('username').addEventListener('keydown',function(e){if(e.key==='Enter')loginWithKeychain();});
</script>
</body>
</html>
